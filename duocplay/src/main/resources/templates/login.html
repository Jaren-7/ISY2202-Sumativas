<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DUOCPLAY - Iniciar sesión</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <header class="navbar">
        <div class="container nav-content">

            <a th:href="@{/}" class="logo">DUOCPLAY</a>

            <nav>
                <a th:href="@{/}">Inicio</a>
                <a th:href="@{/eventos}">Eventos</a>
            </nav>

        </div>
    </header>

    <main class="container login-container">

        <section class="login-card">

            <h1>Iniciar sesión</h1>

            <p>Ingresa tus credenciales para acceder a DUOCPLAY.</p>


            <!-- MENSAJE DE ERROR -->
            <div class="alert alert-error" th:if="${param.error}">

                Usuario o contraseña incorrectos.

            </div>

            <div class="alert alert-success" th:if="${param.logout}">

                Has cerrado sesión correctamente.

            </div>


            <form th:action="@{/login}" method="post">

                <div class="form-group">

                    <label for="username">Nombre de usuario</label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Ingresa tu username"
                        autocomplete="username"
                        required>

                </div>


                <div class="form-group">

                    <label for="password">Contraseña</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingresa tu contraseña"
                        autocomplete="current-password"
                        required>

                </div>

                <input
                    type="hidden"
                    th:name="${_csrf.parameterName}"
                    th:value="${_csrf.token}">


                <button type="submit" class="btn-primary btn-full">

                    Iniciar sesión

                </button>

            </form>


            <div class="login-footer">

                <a th:href="@{/}">
                    Volver al inicio
                </a>

            </div>

        </section>

    </main>

    <footer class="footer">

        <p>DUOCPLAY - Comunidad Gamer</p>

    </footer>

</body>
</html>
